<script>
const games=[
["Highway Racer","Racing","🏎️","Dodge traffic and survive the highway.","highway"],
["Snake Classic","Arcade","🐍","Eat the dots and grow without crashing.","snake"],
["Pong Duel","Arcade","🏓","Keep the ball in play. Beat the CPU.","pong"],
["Brick Breaker","Arcade","🧱","Break every brick with your paddle.","breakout"],
["Flappy Sky","Arcade","🐤","Fly through the gaps. Tap or press Space.","flappy"],
["Space Defender","Action","🚀","Shoot incoming invaders and stay alive.","shooter"],
["Dodge Zone","Action","💥","Move left and right to avoid falling blocks.","dodge"],
["Quick Tap","Arcade","⚡","Tap the target as many times as you can in 20 seconds.","tap"],

["Tic Tac Toe","Puzzle","❎","Get three in a row against the computer.","ttt"]
];
const root=document.getElementById('games'),search=document.getElementById('search');let category='All';
function render(){root.innerHTML='';games.forEach((g,i)=>{if((category!=='All'&&g[1]!==category)||!g[0].toLowerCase().includes(search.value.toLowerCase()))return;let el=document.createElement('article');el.className='game';el.innerHTML='<div class="art">'+g[2]+'</div><div class="info"><h3>'+g[0]+' <span class="tag">PLAYABLE</span></h3><p>'+g[1]+' · '+g[3]+'</p><button class="play">Play now</button></div>';el.querySelector('button').onclick=()=>openGame(g[4],g[0]);root.appendChild(el)})}
search.oninput=render;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');category=b.dataset.cat;render()});render();
const modal=document.getElementById('modal'),c=document.getElementById('board'),x=c.getContext('2d'),status=document.getElementById('gameStatus'),hint=document.getElementById('hint'),controls=document.getElementById('controls');let mode='',timer=0,raf=0,keys={},state={},last=0;
function text(t){status.textContent=t}function clear(){cancelAnimationFrame(raf);clearInterval(timer);timer=0;raf=0;keys={};controls.innerHTML=''}
function btn(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;controls.appendChild(b)}
function openGame(m,title){clear();mode=m;document.getElementById('gameTitle').textContent=title;modal.classList.add('show');document.getElementById('restart').onclick=()=>openGame(mode,title);setup()}
document.getElementById('close').onclick=()=>{clear();modal.classList.remove('show')};
document.addEventListener('keydown',e=>{keys[e.key]=true;if(mode==='ttt')return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.key]=false);
function loop(fn){last=performance.now();function frame(t){let dt=Math.min((t-last)/16.67,2);last=t;fn(dt);raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
function setup(){x.clearRect(0,0,c.width,c.height);hint.textContent='';if(mode==='snake')snake();if(mode==='pong')pong();if(mode==='breakout')breakout();if(mode==='flappy')flappy();if(mode==='shooter')shooter();if(mode==='dodge')dodge();if(mode==='tap')tap();if(mode==='memory')memory();if(mode==='ttt')ttt();if(mode==='highway')highway()}
function bg(){x.fillStyle='#101a30';x.fillRect(0,0,480,360)}
function snake(){let s={body:[[10,10],[9,10],[8,10]],dir:[1,0],food:[15,10],score:0};state=s;text('Score: 0');hint.textContent='Use arrow keys or swipe. Eat the red food.';let acc=0;loop(dt=>{acc+=dt;if(acc<7)return;acc=0;let d=s.dir;if(keys.ArrowUp&&d[1]!==1)d=[0,-1];if(keys.ArrowDown&&d[1]!==-1)d=[0,1];if(keys.ArrowLeft&&d[0]!==1)d=[-1,0];if(keys.ArrowRight&&d[0]!==-1)d=[1,0];s.dir=d;let h=[s.body[0][0]+d[0],s.body[0][1]+d[1]];if(h[0]<0||h[0]>=24||h[1]<0||h[1]>=18||s.body.some(p=>p[0]===h[0]&&p[1]===h[1])){clear();text('Game over · Score '+s.score);return} s.body.unshift(h);if(h[0]===s.food[0]&&h[1]===s.food[1]){s.score++;s.food=[Math.floor(Math.random()*24),Math.floor(Math.random()*18)];text('Score: '+s.score)}else s.body.pop();bg();x.fillStyle='#ff6b6b';x.fillRect(s.food[0]*20,s.food[1]*20,18,18);x.fillStyle='#68e0a5';s.body.forEach(p=>x.fillRect(p[0]*20,p[1]*20,18,18))})}
function pong(){let s={py:145,cy:145,bx:240,by:180,vx:4,vy:2,score:0};state=s;hint.textContent='Move your paddle with ↑ and ↓. Touch controls below.';btn('▲',()=>s.py-=28);btn('▼',()=>s.py+=28);loop(dt=>{s.py+=(keys.ArrowUp?-5:0)+(keys.ArrowDown?5:0);s.py=Math.max(0,Math.min(290,s.py));s.cy+=Math.sign(s.by-(s.cy+35))*2.4*dt;s.by+=s.vy*dt;s.bx+=s.vx*dt;if(s.by<8||s.by>352)s.vy*=-1;if(s.bx<30&&s.by>s.py&&s.by<s.py+70){s.vx=Math.abs(s.vx);s.score++;text('Score: '+s.score)}if(s.bx>450&&s.by>s.cy&&s.by<s.cy+70)s.vx=-Math.abs(s.vx);if(s.bx<0||s.bx>480){s.bx=240;s.by=180;s.vx=s.bx<0?4:-4}bg();x.fillStyle='#8b6cff';x.fillRect(12,s.py,10,70);x.fillRect(458,s.cy,10,70);x.fillStyle='white';x.beginPath();x.arc(s.bx,s.by,8,0,7);x.fill()})}
function breakout(){let s={px:205,bx:240,by:300,vx:3,vy:-4,bricks:[]};for(let r=0;r<4;r++)for(let q=0;q<8;q++)s.bricks.push({x:12+q*58,y:25+r*25,on:1});hint.textContent='Move with ← → or touch the lower area.';loop(dt=>{s.px+=(keys.ArrowLeft?-6:0)+(keys.ArrowRight?6:0);s.px=Math.max(0,Math.min(400,s.px));s.bx+=s.vx*dt;s.by+=s.vy*dt;if(s.bx<7||s.bx>473)s.vx*=-1;if(s.by<7)s.vy= Math.abs(s.vy);if(s.by>325&&s.bx>s.px&&s.bx<s.px+80)s.vy=-Math.abs(s.vy);s.bricks.forEach(b=>{if(b.on&&s.bx>b.x&&s.bx<b.x+50&&s.by>b.y&&s.by<b.y+16){b.on=0;s.vy*=-1}});if(s.by>360){clear();text('Ball lost · Restart to try again')}bg();s.bricks.forEach(b=>{if(b.on){x.fillStyle='#f5a65b';x.fillRect(b.x,b.y,50,16)}});x.fillStyle='#8b6cff';x.fillRect(s.px,335,80,12);x.fillStyle='white';x.beginPath();x.arc(s.bx,s.by,7,0,7);x.fill()})}
function flappy(){let s={y:170,v:0,obs:[],score:0};function flap(){s.v=-6}btn('FLAP',flap);c.onclick=flap;hint.textContent='Tap the game or press Space to flap.';loop(dt=>{if(keys[' ']){flap();keys[' ']=false}s.v+=.28*dt;s.y+=s.v*dt;if(Math.random()<.018)s.obs.push({x:500,gap:130+Math.random()*100});s.obs.forEach(o=>o.x-=3*dt);s.obs=s.obs.filter(o=>o.x>-50);let hit=s.y<0||s.y>340||s.obs.some(o=>o.x<75&&o.x>25&&(s.y<o.gap-55||s.y>o.gap+55));if(hit){clear();text('Game over · Score '+s.score)}s.obs.forEach(o=>{if(!o.p&&o.x<60){o.p=1;s.score++;text('Score: '+s.score)}});bg();x.fillStyle='#5fd2a4';s.obs.forEach(o=>{x.fillRect(o.x,0,42,o.gap-55);x.fillRect(o.x,o.gap+55,42,360)});x.fillStyle='#ffd166';x.beginPath();x.arc(60,s.y,13,0,7);x.fill()})}
function shooter(){let s={px:235,shots:[],foes:[],score:0};hint.textContent='Move with ← →. Press Space or tap to shoot.';function shoot(){s.shots.push({x:s.px+8,y:300})}loop(dt=>{s.px+=(keys.ArrowLeft?-5:0)+(keys.ArrowRight?5:0);s.px=Math.max(5,Math.min(455,s.px));if(keys[' ']){shoot();keys[' ']=false}if(Math.random()<.025)s.foes.push({x:Math.random()*450,y:-15});s.shots.forEach(a=>a.y-=7*dt);s.foes.forEach(a=>a.y+=2.2*dt);s.shots=s.shots.filter(a=>a.y>-10);s.foes=s.foes.filter(a=>a.y<380);s.foes.forEach(f=>s.shots.forEach(a=>{if(Math.abs(f.x-a.x)<17&&Math.abs(f.y-a.y)<17){f.y=400;a.y=-20;s.score++;text('Score: '+s.score)}}));if(s.foes.some(f=>f.y>330&&Math.abs(f.x-s.px)<22)){clear();text('Defeated · Score '+s.score)}bg();x.fillStyle='#8b6cff';x.fillRect(s.px,315,30,24);x.fillStyle='#fff';s.shots.forEach(a=>x.fillRect(a.x,a.y,4,12));x.fillStyle='#ff6b6b';s.foes.forEach(a=>x.fillRect(a.x,a.y,24,20))})}
function dodge(){let s={px:225,blocks:[],score:0};hint.textContent='Move with ← → or use the buttons.';btn('◀',()=>s.px-=35);btn('▶',()=>s.px+=35);loop(dt=>{s.px+=(keys.ArrowLeft?-5:0)+(keys.ArrowRight?5:0);s.px=Math.max(0,Math.min(440,s.px));if(Math.random()<.035)s.blocks.push({x:Math.random()*450,y:-20});s.blocks.forEach(b=>b.y+=3.5*dt);s.blocks=s.blocks.filter(b=>b.y<380);if(s.blocks.some(b=>b.y>300&&b.y<350&&Math.abs(b.x-s.px)<28)){clear();text('Game over · Score '+s.score)}s.score+=dt*.15;text('Score: '+Math.floor(s.score));bg();x.fillStyle='#8b6cff';x.fillRect(s.px,315,32,28);x.fillStyle='#ff6b6b';s.blocks.forEach(b=>x.fillRect(b.x,b.y,28,28))})}
function tap(){let s={n:0,left:20,target:[220,160]};let hit=()=>{if(s.left<=0)return;s.n++;text('Taps: '+s.n+' · '+Math.ceil(s.left)+'s');s.target=[30+Math.random()*390,30+Math.random()*280]};c.onclick=hit;btn('TAP TARGET',hit);text('Taps: 0 · 20s');hint.textContent='Tap the glowing circle as quickly as possible.';loop(dt=>{s.left-=dt/60;if(s.left<=0){clear();text('Time up · Final taps: '+s.n)}bg();x.fillStyle='#8b6cff';x.beginPath();x.arc(s.target[0],s.target[1],28,0,7);x.fill();x.fillStyle='white';x.font='16px Arial';x.fillText('TAP',s.target[0]-17,s.target[1]+5)})}
function memory(){let vals=['🍎','🚗','🐱','⚽','🌟','🍕','🎮','🚀'];let a=[...vals,...vals].sort(()=>Math.random()-.5),open=[],done=[];c.onclick=e=>{let r=c.getBoundingClientRect(),col=Math.floor((e.clientX-r.left)/ (r.width/4)),row=Math.floor((e.clientY-r.top)/(r.height/4)),i=row*4+col;if(i<0||i>=16||done.includes(i)||open.includes(i)||open.length===2)return;open.push(i);draw();if(open.length===2){if(a[open[0]]===a[open[1]]){done.push(...open);open=[];text('Pairs: '+done.length/2);if(done.length===16)text('You win!')}else setTimeout(()=>{open=[];draw()},650)}};hint.textContent='Tap two cards to find matching pairs.';function draw(){bg();for(let i=0;i<16;i++){let xx=(i%4)*120+5,yy=Math.floor(i/4)*90+5;x.fillStyle=done.includes(i)?'#245f56':'#303d61';x.fillRect(xx,yy,110,80);x.fillStyle='white';x.font='30px Arial';x.fillText(done.includes(i)||open.includes(i)?a[i]:'?',xx+40,yy+50)}}text('Pairs: 0');draw()}
function ttt(){let a=Array(9).fill(''),turn='X',over=false;c.onclick=e=>{if(over)return;let r=c.getBoundingClientRect(),col=Math.floor((e.clientX-r.left)/(r.width/3)),row=Math.floor((e.clientY-r.top)/(r.height/3)),i=row*3+col;if(a[i])return;a[i]='X';check();if(!over){let opts=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(opts.length){a[opts[Math.floor(Math.random()*opts.length)]]='O';check()}}draw()};function check(){let w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let win=w.find(q=>a[q[0]]&&a[q[0]]===a[q[1]]&&a[q[1]]===a[q[2]]);if(win){over=true;text(a[win[0]]==='X'?'You win!':'CPU wins!')}else if(a.every(Boolean)){over=true;text('Draw!')}}function draw(){bg();for(let i=0;i<9;i++){let xx=i%3*160,yy=Math.floor(i/3)*120;x.strokeStyle='#8190b8';x.strokeRect(xx+5,yy+5,150,110);x.fillStyle='white';x.font='50px Arial';x.fillText(a[i],xx+58,yy+75)}}hint.textContent='Tap a square. You are X, computer is O.';text('Your turn');draw()}
function highway(){let s={px:220,cars:[],score:0};hint.textContent='Use arrow keys or buttons to avoid traffic.';btn('◀',()=>s.px-=30);btn('▶',()=>s.px+=30);loop(dt=>{s.px+=(keys.ArrowLeft?-5:0)+(keys.ArrowRight?5:0);s.px=Math.max(65,Math.min(385,s.px));if(Math.random()<.025)s.cars.push({x:70+Math.floor(Math.random()*7)*48,y:-70});s.cars.forEach(a=>a.y+=3.5*dt);s.cars=s.cars.filter(a=>a.y<380);if(s.cars.some(a=>a.y>270&&a.y<340&&Math.abs(a.x-s.px)<30)){clear();text('Crash! Score '+Math.floor(s.score))}s.score+=dt*.2;text('Score: '+Math.floor(s.score));bg();x.fillStyle='#3d475d';x.fillRect(45,0,390,360);x.fillStyle='#f5e9a8';for(let y=0;y<360;y+=65)x.fillRect(237,y,6,35);x.fillStyle='#8b6cff';x.fillRect(s.px,290,30,45);x.fillStyle='#f06b72';s.cars.forEach(a=>x.fillRect(a.x,a.y,30,45))})}
let tx=0;c.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});c.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>15){keys[dx<0?'ArrowLeft':'ArrowRight']=true;setTimeout(()=>keys.ArrowLeft=keys.ArrowRight=false,120)}},{passive:true});
</script></body></html>
