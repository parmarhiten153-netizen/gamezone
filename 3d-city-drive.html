<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameZone | 3D City Drive</title><style>
*{box-sizing:border-box}body{margin:0;background:#090e1d;color:#fff;font:15px Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:12px 4%;background:#171d32}a,button{color:#fff;background:#5b45e0;border:0;border-radius:10px;padding:11px 16px;text-decoration:none;font-weight:800;cursor:pointer}main{max-width:1100px;margin:18px auto;padding:0 14px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}#game{height:min(68vh,650px);min-height:330px;border-radius:16px;overflow:hidden;background:#78b9e8;margin-top:14px}#game canvas{display:block;width:100%;height:100%;touch-action:none}.controls{display:flex;justify-content:center;gap:12px;margin:14px;flex-wrap:wrap}.controls button{min-width:68px;font-size:18px;touch-action:none}.help{text-align:center;color:#bfc8e2;font-size:13px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script></head><body>
<header><strong>🎮 GAMEZONE · 3D CITY DRIVE</strong><a href="./index.html">← Back to games</a></header><main><div class="top"><h2>3D City Drive</h2><strong id="status">Loading 3D world...</strong><button onclick="location.reload()">↻ Restart</button></div><div id="game"></div><div class="controls"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><p class="help">Keyboard: ← → steer, ↑ accelerate, ↓ brake. Mobile: hold the buttons. Avoid traffic!</p></main>
<script>
(()=>{
const host=document.getElementById('game'),status=document.getElementById('status');
if(!window.THREE){status.textContent='3D engine could not load. Check your internet connection.';return}
const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x8bc9f0);scene.fog=new T.Fog(0x8bc9f0,55,210);
const camera=new T.PerspectiveCamera(65,1,.1,350);
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;host.appendChild(renderer.domElement);
function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}new ResizeObserver(resize).observe(host);resize();
scene.add(new T.HemisphereLight(0xe3f5ff,0x536047,2));const sun=new T.DirectionalLight(0xfff0cf,2);sun.position.set(-18,30,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,rough=.75,metal=0)=>new T.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const road=new T.Mesh(new T.PlaneGeometry(15,280),mat(0x292f3b));road.rotation.x=-Math.PI/2;road.position.z=-100;road.receiveShadow=true;scene.add(road);
const grass=new T.Mesh(new T.PlaneGeometry(220,280),mat(0x43894a));grass.rotation.x=-Math.PI/2;grass.position.set(0,-.09,-100);scene.add(grass);
for(const xx of [-7.3,7.3]){const edge=new T.Mesh(new T.BoxGeometry(.18,.04,280),mat(0xffffff));edge.position.set(xx,.04,-100);scene.add(edge)}
const dashes=[];for(let z=-220;z<20;z+=10)for(const xx of [-2.5,2.5]){const d=new T.Mesh(new T.BoxGeometry(.13,.04,4.5),mat(0xfaf3d8));d.position.set(xx,.05,z);scene.add(d);dashes.push(d)}
const glass=mat(0x75c9e8,.22,.25),wheel=mat(0x11151b),head=mat(0xfff0bd),tail=mat(0xff2929);
function car(color){const g=new T.Group(),body=new T.Mesh(new T.BoxGeometry(1.7,.58,3.2),mat(color,.3,.3));body.position.y=.72;body.castShadow=true;g.add(body);const cabin=new T.Mesh(new T.BoxGeometry(1.28,.68,1.6),glass);cabin.position.set(0,1.32,-.1);cabin.castShadow=true;g.add(cabin);for(const x of [-.9,.9])for(const z of [-1,1]){const w=new T.Mesh(new T.CylinderGeometry(.32,.32,.2,14),wheel);w.rotation.z=Math.PI/2;w.position.set(x,.38,z);g.add(w)}for(const x of [-.5,.5]){let l=new T.Mesh(new T.BoxGeometry(.28,.16,.08),head);l.position.set(x,.75,-1.62);g.add(l);let t=new T.Mesh(new T.BoxGeometry(.28,.16,.08),tail);t.position.set(x,.75,1.62);g.add(t)}return g}
const player=car(0x5945e8);player.position.set(0,0,5);scene.add(player);
const traffic=[],colors=[0xff563d,0xffc928,0x25b7a5,0xe7eaf2,0x242b42];
function spawn(){const v=car(colors[Math.floor(Math.random()*colors.length)]);v.position.set([-5,0,5][Math.floor(Math.random()*3)],0,-155-Math.random()*45);scene.add(v);traffic.push(v)}
const trees=[];for(let i=0;i<32;i++)for(const side of [-1,1]){const z=-i*8-10,tr=new T.Mesh(new T.CylinderGeometry(.16,.22,1.5,7),mat(0x765034)),crown=new T.Mesh(new T.SphereGeometry(1.15,8,7),mat(i%2?0x2e8245:0x438d4d));tr.position.set(side*(11+Math.random()*3),.75,z);crown.position.set(tr.position.x,2,z);crown.castShadow=true;scene.add(tr,crown);trees.push({tr,crown})}
const keys={};window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){keys[e.key]=true;e.preventDefault()}});window.addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
let px=0,speed=0,score=0,clock=0,prev=performance.now(),over=false;
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-prev)/16.67,2);prev=now;
if(!over){const target=keys.ArrowUp?1:keys.ArrowDown?-.5:0;speed+=(target+.35-speed)*.025*dt;speed=Math.max(0,Math.min(1.5,speed));px+=(keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0);px=Math.max(-5.2,Math.min(5.2,px));player.position.x+=(px-player.position.x)*.16*dt;player.rotation.z+=(keys.ArrowLeft?.13:keys.ArrowRight?-.13:0-player.rotation.z)*.12*dt;const travel=(.7+speed*1.8)*dt;dashes.forEach(d=>{d.position.z+=travel;if(d.position.z>18)d.position.z-=240});traffic.forEach(v=>{v.position.z+=travel*(1.2+speed*.45);if(v.position.z>15){scene.remove(v);v.userData.passed=true;score+=10}});for(const v of traffic){if(!v.userData.passed&&Math.abs(v.position.z-player.position.z)<2.4&&Math.abs(v.position.x-player.position.x)<1.4){over=true;status.textContent='CRASH! Score '+score+' · Press Restart';break}}for(let i=traffic.length-1;i>=0;i--)if(traffic[i].userData.passed)traffic.splice(i,1);clock+=dt;if(clock>Math.max(32,85-speed*20)){clock=0;spawn()}trees.forEach(o=>{o.tr.position.z+=travel*.7;o.crown.position.z+=travel*.7;if(o.tr.position.z>18){o.tr.position.z-=256;o.crown.position.z-=256}});score+=Math.floor(travel*.06);if(!over)status.textContent='SCORE '+score+'  |  SPEED '+Math.round(40+speed*90)+' km/h'}
camera.position.set(player.position.x*.32,5.5,13);camera.lookAt(player.position.x*.4,0,-12);renderer.render(scene,camera)}
spawn();spawn();camera.position.set(0,5.5,13);camera.lookAt(0,0,-12);status.textContent='3D world ready · Score 0';requestAnimationFrame(frame);
})();
</script></body></html>
