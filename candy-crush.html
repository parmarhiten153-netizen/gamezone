<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candy Match | GameZone</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7ff;color:#20233a}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 5%;background:#fff;box-shadow:0 2px 14px #17204a12}.top a{color:#4438d8;text-decoration:none;font-weight:800}.wrap{max-width:760px;margin:24px auto;padding:16px;text-align:center}.panel{background:white;border-radius:22px;padding:22px;box-shadow:0 10px 35px #20295b12}.stats{display:flex;justify-content:center;gap:26px;font-weight:800;margin:12px}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:500px;margin:18px auto}.cell{aspect-ratio:1;border:0;border-radius:13px;font-size:clamp(22px,5vw,38px);background:#eef0ff;cursor:pointer;box-shadow:inset 0 -3px #00000010;transition:transform .12s}.cell.selected{outline:4px solid #5b50e8;transform:scale(.92)}button.action{border:0;background:#5145df;color:#fff;border-radius:12px;padding:12px 22px;font-weight:800;cursor:pointer}.note{color:#777b92;font-size:14px}
</style></head><body><div class="top"><a href="index.html">← GAMEZONE</a><b>🍬 CANDY MATCH</b><span></span></div><div class="wrap"><div class="panel"><h1>🍭 Candy Match</h1><p>Match 3 or more candies. Swap two neighbouring tiles.</p><div class="stats"><span>Score: <b id="score">0</b></span><span>Moves: <b id="moves">30</b></span></div><div id="board" class="board"></div><button class="action" onclick="start()">New Game</button><p class="note">Tap one candy, then a neighbour. Make combos to score points.</p></div></div><script>
const N=8,icons=['🍓','🍋','🍇','🍊','🫐','🍏'];let a=[],sel=-1,score=0,moves=30,busy=false;
const board=document.getElementById('board');
function rand(){return Math.floor(Math.random()*icons.length)}
function start(){a=Array.from({length:N*N},rand);score=0;moves=30;sel=-1;while(matches().length){matches().forEach(i=>a[i]=rand())}draw();stats()}
function stats(){document.getElementById('score').textContent=score;document.getElementById('moves').textContent=moves}
function matches(){let s=new Set();for(let y=0;y<N;y++)for(let x=0;x<N;x++){let i=y*N+x;if(x<6&&a[i]===a[i+1]&&a[i]===a[i+2]){let j=x;while(j<N&&a[y*N+j]===a[i])s.add(y*N+j++)}if(y<6&&a[i]===a[i+N]&&a[i]===a[i+2*N]){let j=y;while(j<N&&a[j*N+x]===a[i])s.add(j++*N+x)}}return [...s]}
function draw(){board.innerHTML='';a.forEach((v,i)=>{let b=document.createElement('button');b.className='cell'+(i===sel?' selected':'');b.textContent=icons[v];b.onclick=()=>tap(i);board.appendChild(b)})}
function tap(i){if(busy||moves<=0)return;if(sel<0){sel=i;draw();return}if(i===sel){sel=-1;draw();return}let x=i%N,y=Math.floor(i/N),sx=sel%N,sy=Math.floor(sel/N);if(Math.abs(x-sx)+Math.abs(y-sy)!==1){sel=i;draw();return} [a[i],a[sel]]=[a[sel],a[i]];let m=matches();if(!m.length){[a[i],a[sel]]=[a[sel],a[i]];sel=i;draw();return}moves--;sel=-1;busy=true;resolve()}
function resolve(){let m=matches();if(!m.length){busy=false;draw();stats();if(moves===0)setTimeout(()=>alert('Game over! Score: '+score),50);return}score+=m.length*10;m.forEach(i=>a[i]=-1);draw();setTimeout(()=>{for(let x=0;x<N;x++){let col=[];for(let y=N-1;y>=0;y--)if(a[y*N+x]>=0)col.push(a[y*N+x]);while(col.length<N)col.push(rand());for(let y=N-1;y>=0;y--)a[y*N+x]=col[N-1-y]}resolve()},170)}
start();
</script></body></html>
