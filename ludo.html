<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludo | GameZone</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6ff;font-family:Arial;color:#222}.top{padding:15px 5%;background:#fff;display:flex;justify-content:space-between;font-weight:800}.top a{color:#5145df;text-decoration:none}.wrap{max-width:760px;margin:20px auto;padding:14px;text-align:center}.board{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;max-width:520px;margin:16px auto;background:#fff;padding:8px;border-radius:18px;box-shadow:0 8px 28px #18234b18}.cell{aspect-ratio:1;border-radius:6px;background:#f0f1f7;display:flex;align-items:center;justify-content:center;font-size:clamp(9px,2.4vw,17px);position:relative}.home{font-size:clamp(8px,2vw,14px);font-weight:900}.token{border:0;border-radius:50%;width:80%;height:80%;font-size:clamp(9px,2vw,15px);font-weight:900;color:white;cursor:pointer;box-shadow:inset 0 -3px #0003,0 2px 4px #0002}.red{background:#ee424c}.green{background:#27b66a}.yellow{background:#f4c542;color:#473500}.blue{background:#4386ed}.controls{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}.dice{font-size:36px;background:#fff;border:2px solid #ddd;border-radius:14px;padding:8px 18px;cursor:pointer}.action{border:0;background:#5145df;color:#fff;padding:12px 20px;border-radius:12px;font-weight:800;cursor:pointer}.status{font-weight:800;margin:12px}.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:13px}
</style></head><body><div class="top"><a href="index.html">← GAMEZONE</a><span>🎲 LUDO</span><span>4 PLAYERS</span></div><div class="wrap"><h1>Classic Ludo</h1><p>Four players, take turns. Roll a 6 to bring a token out. First to finish wins.</p><div class="legend"><span>🔴 Red</span><span>🟢 Green</span><span>🟡 Yellow</span><span>🔵 Blue</span></div><div class="board" id="board"></div><div class="controls"><button class="dice" id="dice" onclick="roll()">🎲</button><button class="action" onclick="reset()">New Game</button></div><div class="status" id="status">Red player's turn. Roll the dice!</div><p style="font-size:13px;color:#777">Local pass-and-play for 4 players. Tap a highlighted token after rolling.</p></div><script>
const colors=['red','green','yellow','blue'],names=['Red','Green','Yellow','Blue'],starts=[0,13,26,39],safe=[0,8,13,21,26,34,39,47],track=[];for(let x=1;x<=9;x++)track.push([x,0]);for(let y=1;y<=9;y++)track.push([10,y]);for(let x=9;x>=1;x--)track.push([x,10]);for(let y=9;y>=1;y--)track.push([0,y]); // perimeter 36 cells
const route=[];for(let i=0;i<52;i++){let p=track[Math.floor(i*36/52)];route.push(p)}
let turn=0,dice=0,tokens=colors.map(()=>[-1,-1,-1,-1]),finished=colors.map(()=>0),rolled=false;
const board=document.getElementById('board');
function reset(){turn=0;dice=0;tokens=colors.map(()=>[-1,-1,-1,-1]);finished=colors.map(()=>0);rolled=false;draw();msg('Red player turn. Roll the dice!')}
function msg(t){document.getElementById('status').textContent=t}
function roll(){if(rolled)return;dice=1+Math.floor(Math.random()*6);rolled=true;document.getElementById('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][dice-1];let movable=tokens[turn].map((p,i)=>(p===-1&&dice===6)||(p>=0&&p<56-dice)?i:-1).filter(i=>i>=0);draw();if(!movable.length){msg(names[turn]+' rolled '+dice+'. No move, next player.');setTimeout(next,900)}else msg(names[turn]+' rolled '+dice+'. Tap a glowing token.')}
function next(){rolled=false;dice=0;turn=(turn+1)%4;document.getElementById('dice').textContent='🎲';draw();msg(names[turn]+' player turn. Roll the dice!')}
function move(c,i){if(c!==turn||!rolled)return;let p=tokens[c][i];if(p===-1){if(dice!==6)return;tokens[c][i]=0}else{tokens[c][i]=p+dice}let np=tokens[c][i];if(np>=56){tokens[c][i]=56;finished[c]++}if(np<52){let abs=(starts[c]+np)%52;if(!safe.includes(abs)){for(let oc=0;oc<4;oc++)if(oc!==c)tokens[oc].forEach((v,j)=>{if(v>=0&&v<52&&(starts[oc]+v)%52===abs)tokens[oc][j]=-1})}}let again=dice===6;rolled=false;dice=0;document.getElementById('dice').textContent='🎲';if(finished[c]===4){draw();msg(names[c]+' wins! 🎉');return}if(!again)turn=(turn+1)%4;draw();msg(again?names[c]+' rolled a 6! Roll again.':names[turn]+' player turn. Roll the dice!')}
function draw(){board.innerHTML='';let coords={};route.forEach((p,i)=>coords[p.join(',')]=i);for(let y=0;y<11;y++)for(let x=0;x<11;x++){let d=document.createElement('div');d.className='cell';let at=route.findIndex(p=>p[0]===x&&p[1]===y);if(at>=0){d.style.background=safe.includes(at)?'#fff1c9':'#e9edf7';d.textContent='·';for(let c=0;c<4;c++)tokens[c].forEach((v,j)=>{if(v>=0&&v<52&&(starts[c]+v)%52===at){let b=document.createElement('button');b.className='token '+colors[c];b.textContent=j+1;b.onclick=()=>move(c,j);if(c===turn&&rolled&&((v===-1&&dice===6)||(v>=0&&v<56-dice)))b.style.outline='4px solid #222';d.appendChild(b)}})}else if((x<4&&y<4)||(x>6&&y<4)||(x<4&&y>6)||(x>6&&y>6)){let c=x<4?(y<4?0:3):(y<4?1:2);d.className='cell home';d.style.background=['#ffdfe1','#dff8e9','#fff4c9','#dceaff'][c];d.textContent=['🔴','🟢','🟡','🔵'][c]+' '+finished[c]+'/4'}board.appendChild(d)}}
reset();
</script></body></html>
